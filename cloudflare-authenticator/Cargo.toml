[package]
name = "cloudflare-authenticator"
version = "0.1.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "http2",
    "charset",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
urlencoding = "2.1.0"
serde_urlencoded = "0.7.1"
# jsonwebtoken 10 ships no crypto provider by default; `rust_crypto` keeps the
# backend pure Rust so the release build links statically against musl.
jsonwebtoken = { version = "11", features = ["rust_crypto"] }

[dev-dependencies]
mockito = "1.6.1"
# Used to mint a throwaway RSA keypair per test run, so signed-token tests need
# no committed private key and no hardcoded expiry. Already in the dependency
# tree via jsonwebtoken's rust_crypto backend.
base64 = "0.23"
rand = "0.8"
rsa = { version = "0.9", features = ["pem"] }
