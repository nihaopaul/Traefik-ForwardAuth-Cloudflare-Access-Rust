[package]
name = "cloudflare-authenticator"
version = "0.1.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "http2",
    "charset",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
urlencoding = "2.1.0"
serde_urlencoded = "0.7.1"
# jsonwebtoken 10 ships no crypto provider by default; `rust_crypto` keeps the
# backend pure Rust so the release build links statically against musl.
jsonwebtoken = { version = "10", features = ["rust_crypto"] }

[dev-dependencies]
mockito = "1.6.1"
